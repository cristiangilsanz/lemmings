[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lemmings"
dynamic = ["version"]
description = "A Lemmings clone with procedurally generated levels, built with Pyxel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cristian Gil Sanz" },
    { name = "Alberto García Arribas" },
]
dependencies = ["pyxel>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lemmings = "lemmings.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "lemmings.__version__" }

[tool.setuptools.package-data]
lemmings = ["assets/*.pyxres"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
